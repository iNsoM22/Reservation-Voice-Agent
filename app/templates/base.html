<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Patient dashboard{% endblock %} · Careline</title>
    <link rel="stylesheet" href="/static/dashboard.css">
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="/dashboard/patients"><span class="brand-mark">C</span><span>Careline<small>ADMINISTRATION</small></span></a>
      <nav aria-label="Main navigation">
        <a class="nav-link {{ 'active' if request.url.path.startswith('/dashboard/patients') else '' }}" href="/dashboard/patients" aria-label="Patients"><span aria-hidden="true">&#x25A6;</span><span class="nav-label">Patients</span></a>
        <a class="nav-link {{ 'active' if request.url.path.startswith('/dashboard/calls') else '' }}" href="/dashboard/calls" aria-label="Calls"><span aria-hidden="true">&#x25F7;</span><span class="nav-label">Calls</span></a>
        <a class="nav-link {{ 'active' if request.url.path.startswith('/dashboard/simulation') else '' }}" href="/dashboard/simulation" aria-label="Simulation"><span aria-hidden="true">&#x25C7;</span><span class="nav-label">Simulation</span></a>
      </nav>
      <div class="sidebar-bottom"><span class="avatar">A</span><span>Administrator<small>Workspace admin</small></span></div>
    </aside>
    <main class="main">
      <header class="topbar"><span>Patient registration</span><form method="post" action="/dashboard/logout"><input type="hidden" name="csrf_token" value="{{ request.cookies.get('dashboard_csrf', '') }}"><button class="text-button" type="submit">Sign out</button></form></header>
      <div class="content">{% block content %}{% endblock %}</div>
    </main>
  </body>
</html>
